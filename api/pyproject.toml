[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambition-gazette-py-api"
version = "0.1.0"
description = "Ambition Gazette FastAPI + Python Backend Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-socketio>=5.11.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "supabase>=2.7.0",
    "google-genai>=0.1.0",
    "python-dotenv>=1.0.1",
    "asyncpg>=0.29.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
